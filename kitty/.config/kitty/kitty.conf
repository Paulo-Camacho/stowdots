font_family      Iosevka Nerd Font Mono
bold_font        Iosevka Nerd Font Mono Bold
italic_font      Iosevka Nerd Font Mono Italic
bold_italic_font Iosevka Nerd Font Mono Bold Italic

# gives padding from the right of the terminal with 6, the first value is horizontal padding
window_padding_width 0 6

# alt number to -> tabs
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab -1

# remaps
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+t new_tab_with_cwd
map alt+w close_tab

font_size 18

# tabs
tab_bar_edge            top
tab_bar_align           left
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        1

# tab colors: pinned in tabs.conf, included after theme.conf so they survive
# any theme switch
include ./tabs.conf

tab_title_template        "{index}: {title}"
active_tab_title_template "{index}: {title}"

tab_activity_symbol     "• "
bell_on_tab             "! "

# ---- splits (ghostty-matched keybinds) ----
# splits layout = directional panes; stack = zoom
enabled_layouts splits,stack

# create
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current

# cycle
map cmd+[ previous_window
map cmd+] next_window

# directional focus
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right

# resize
map cmd+ctrl+up    resize_window taller 2
map cmd+ctrl+down  resize_window shorter 2
map cmd+ctrl+left  resize_window narrower 2
map cmd+ctrl+right resize_window wider 2
map cmd+ctrl+equal resize_window reset

# zoom current split
map cmd+shift+enter toggle_layout stack

# close split
map cmd+w close_window

# pipes current buffer into less
map ctrl+shift+; show_scrollback


# BEGIN_KITTY_THEME
# Ayu Light
include current-theme.conf
# END_KITTY_THEME

# highlighting
# selection_background #000000

# cursor: soft fade blink (ease-in-out both directions), plus a short smear
# when the cursor jumps. char under cursor stays near-black instead of the
# default (= background), since nvim cannot set that itself.
# interval, then the fade-in easing and the fade-out easing. the material
# cubic-bezier ramps slowly at both ends, so the cursor breathes instead of
# snapping. bump the interval for a slower breath.
cursor_blink_interval 0.9 cubic-bezier(.4,0,.2,1) cubic-bezier(.4,0,.2,1)
cursor_stop_blinking_after 0
cursor_trail 3
cursor_trail_decay 0.05 0.2
