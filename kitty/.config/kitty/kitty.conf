# this links to github repo defined kitty themes
include ./theme.conf

font_family      Iosevka Nerd Font Mono
bold_font        Iosevka Nerd Font Mono Bold
italic_font      Iosevka Nerd Font Mono Italic
bold_italic_font Iosevka Nerd Font Mono Bold Italic

# gives padding from the right of the terminal with 6, the first value is horizontal padding
window_padding_width 0 6

# alt number to -> tabs
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab -1

# remaps
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+t new_tab_with_cwd
map alt+w close_tab

# BEGIN_KITTY_THEME
# Adwaita light
include current-theme.conf
# END_KITTY_THEME

font_size 18

standard terminal colors

# tabs
tab_bar_align left
tab_title_template "{index} : {title}"
tab_bar_edge            top
tab_bar_style           powerline
#tab_powerline_style     round
active_tab_foreground   #b9f27c
#active_tab_font_style   bold
cmd
# highlighting
#selection_foreground #b9f27c
