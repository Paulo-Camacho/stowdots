# start of custom theme
# this links to github repo defined kitty themes
include ./theme.conf

font_family      Iosevka Nerd Font Mono
bold_font        Iosevka Nerd Font Mono Bold
italic_font      Iosevka Nerd Font Mono Italic
bold_italic_font Iosevka Nerd Font Mono Bold Italic

# alt number to -> tabs
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab -1

# remaps
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+t new_tab_with_cwd




# BEGIN_KITTY_THEME
# Adwaita dark
include current-theme.conf
# END_KITTY_THEME

font_size 18

# standard terminal colors
color0  #1a1b26
color8  #444b6a
color1  #f7768e
color9  #ff7a93
color2  #9ece6a
color10 #b9f27c
color3  #e0af68
color11 #ff9e64
color4  #7aa2f7
color12 #7da6ff
color5  #bb9af3
color13 #b6b9ff
color6  #7dcfff
color14 #00f5ff
color7  #a9b1d6
color15 #c0caf5




# tabs
tab_bar_align left
tab_title_template "{index} : {title}"
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     round
active_tab_foreground   #b9f27c
active_tab_font_style   bold

# highlighting
selection_foreground #b9f27c
