# tab bar definition - I had weird behavior with themes and tabs so this makes sure themes never override my tab definitions

# active tab: inverted block, unmistakable against the tab bar
active_tab_background   #000000
active_tab_foreground   #f7f7f7
active_tab_font_style   bold

# inactive tabs: one step off the background, dimmed text, recedes
inactive_tab_background #e6e6e6
inactive_tab_foreground #777777
inactive_tab_font_style normal

tab_bar_background      none
tab_bar_margin_color    none
